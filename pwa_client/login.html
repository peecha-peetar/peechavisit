<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="پیچا ویزیت">
    <meta name="theme-color" content="#020025">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <title>ورود | پیچا ویزیت</title>
    <link href="fonts/vazirmatn.css" rel="stylesheet">
    <link href="ui.css" rel="stylesheet">
    <style>
        body { padding: 0; background: var(--card); }
        @media (min-width: 560px) {
            body { background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; }
            .login-wrap { border: 1px solid var(--border); border-radius: 16px; }
        }
        .login-wrap { width: 100%; max-width: 440px; margin: 0 auto; background: var(--card); padding: 32px 20px 20px; }
        .logo-wrap { text-align: center; margin-bottom: 24px; }
        .logo-wrap img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 10px; border: 1px solid var(--border); }
        .logo-wrap h1 { font-size: 22px; font-weight: 800; color: var(--brand); }
        .logo-wrap p { font-size: 13px; color: var(--muted); margin-top: 2px; }
        .form-group { margin-bottom: 4px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
        .input-wrap { position: relative; }
        .input-icon { display: none; }
        .btn-login { width: 100%; min-height: 52px; margin-top: 20px; border: 0; border-radius: 10px;
                     background: var(--primary); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn-login:active { background: var(--primary-press); }
        .btn-login:disabled { opacity: .6; }
        .error-msg { display: none; margin-bottom: 12px; padding: 10px 12px; border-radius: 10px;
                     background: var(--danger-soft); color: var(--danger); font-size: 14px; }
        .error-msg.show { display: block; }
        .loading { display: none; text-align: center; padding: 8px; color: var(--muted); font-size: 14px; }
        .loading.show { display: block; }
        .footer-txt { text-align: center; font-size: 12px; color: var(--muted); margin-top: 22px; }
        .footer-txt a { color: var(--primary); text-decoration: none; }

        .server-box { margin-top: 18px; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
        .server-box summary { cursor: pointer; font-size: 14px; font-weight: 700; list-style: none;
                              display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .server-box summary::-webkit-details-marker { display: none; }
        .server-box .srv-cur { font-size: 12px; color: var(--muted); direction: ltr; font-weight: 500;
                               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .server-box .srv-body { margin-top: 12px; }
        .server-box input { direction: ltr; text-align: left; }
        .server-box .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.8; }
        .srv-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .srv-btns button { min-height: 44px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
                           border: 1px solid var(--border); background: #fff; color: var(--text); }
        .srv-btns button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .srv-status { display: none; font-size: 13px; margin-top: 10px; font-weight: 600; }
        .srv-status.ok { display: block; color: var(--success); }
        .srv-status.err { display: block; color: var(--danger); }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="logo-wrap">
        <img src="icon-192.png" alt="logo" onerror="this.style.display='none'">
        <h1>پیچا ویزیت</h1>
        <p>PeechaVisit | سامانه مدیریت ویزیتور</p>
    </div>

    <div class="error-msg" id="error-msg"></div>
    <div class="error-msg" id="expired-msg" style="background:#fff3cd;border-color:#ffc107;color:#856404">
        ⏰ اتصال به سرور برقرار شد. لطفاً دوباره وارد شوید.
    </div>
    <div class="loading" id="loading">⏳ در حال بررسی...</div>

    <div class="form-group">
        <label>نام کاربری</label>
        <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="username" placeholder="نام کاربری خود را وارد کنید"
                   autocomplete="username" autocapitalize="none">
        </div>
    </div>

    <div class="form-group">
        <label>رمز عبور</label>
        <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید"
                   autocomplete="current-password">
        </div>
    </div>

    <button class="btn-login" id="login-btn" onclick="doLogin()">
        ورود
    </button>

    <details class="server-box" id="server-box">
        <summary>
            <span>آدرس سرور</span>
            <span class="srv-cur" id="srv-cur"></span>
        </summary>
        <div class="srv-body">
            <input type="text" id="server-input" inputmode="url" autocapitalize="none"
                   placeholder="192.168.1.50">
            <div class="hint">آی‌پی کامپیوتر سرور در شبکه (از دستور ipconfig). پورت پیش‌فرض ۵۰۰۰ است.</div>
            <div class="srv-btns">
                <button type="button" onclick="testServer()">تست اتصال</button>
                <button type="button" class="primary" onclick="saveServer()">ذخیره</button>
            </div>
            <div class="srv-status" id="srv-status"></div>
        </div>
    </details>

    <div class="footer-txt">
        <a href="https://peecha.ir" target="_blank">🌐 peecha.ir</a>
        &nbsp;|&nbsp; PeechaVisit © ۱۴۰۵
    </div>
</div>

<script src="env.js"></script>
<script>
// ── آدرس API از env.js خوانده می‌شود ──
console.log('[PeechaVisit] API:', getApiBase());
console.log('[PeechaVisit] app:', PV_IS_APP, '| online:', navigator.onLine);

// ── پنل آدرس سرور ──
function refreshServerUI() {
    const base = getServerBase();
    document.getElementById('srv-cur').textContent = base || 'تنظیم نشده';
    document.getElementById('server-input').value =
        localStorage.getItem(PV_SERVER_KEY) ? base.replace(/^http:\/\//, '') : '';
    // در اپ، تا وقتی سرور تنظیم نشده پنل باز بماند
    if (!base) document.getElementById('server-box').open = true;
}
function showSrvStatus(ok, msg) {
    const el = document.getElementById('srv-status');
    el.className = 'srv-status ' + (ok ? 'ok' : 'err');
    el.textContent = msg;
}
// نتیجه: 'ok' | 'notapi' (جواب داد ولی API نیست) | 'timeout' | 'network'
async function pingServer(base) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 6000);
    try {
        const r = await fetch(`${base}/`, { signal: ctrl.signal });
        const d = await r.json().catch(() => null);
        return d && d.status === 'running' ? 'ok' : 'notapi';
    } catch (e) {
        return e.name === 'AbortError' ? 'timeout' : 'network';
    } finally { clearTimeout(t); }
}
async function testServer() {
    const base = normalizeServer(document.getElementById('server-input').value) || getServerBase();
    if (!base) { showSrvStatus(false, 'آدرس سرور را وارد کنید.'); return; }
    showSrvStatus(true, '⏳ در حال تست ' + base + ' ...');
    const res = await pingServer(base);
    if (res === 'ok') { showSrvStatus(true, '✅ سرور در دسترس است. «ذخیره» را بزنید.'); return; }

    // اگر پورت دیگری (مثلاً ۸۰۰۰ وب‌اپ) وارد شده، پورت API را امتحان کن
    const u = new URL(base);
    if (u.port !== String(PV_API_PORT)) {
        const alt = `${u.protocol}//${u.hostname}:${PV_API_PORT}`;
        if (await pingServer(alt) === 'ok') {
            document.getElementById('server-input').value = u.hostname;
            showSrvStatus(true, `✅ سرور روی پورت ${PV_API_PORT} پیدا شد. حالا «ذخیره» را بزنید.`);
            return;
        }
    }
    showSrvStatus(false, {
        notapi:  `❌ ${base} جواب داد ولی سرور API نیست. فقط آی‌پی را بدون «:8000» وارد کنید.`,
        timeout: `❌ ${base} جواب نداد. گوشی و کامپیوتر روی یک Wi-Fi باشند و firewall.bat اجرا شده باشد.`,
        network: `❌ اتصال به ${base} برقرار نشد. پنجرهٔ «PeechaVisit API - port 5000» باز باشد و آی‌پی درست باشد.`,
    }[res]);
}
function saveServer() {
    const raw = document.getElementById('server-input').value;
    const s = setServerBase(raw);
    if (raw.trim() && !s) { showSrvStatus(false, 'آدرس نامعتبر است.'); return; }
    refreshServerUI();
    document.getElementById('error-msg').classList.remove('show');
    showSrvStatus(true, s ? '✅ ذخیره شد: ' + s : '✅ به آدرس پیش‌فرض برگشت.');
}
refreshServerUI();

// Enter برای ورود
document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
});

// نمایش پیام در صورت انقضای token
(function checkExpired() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('expired') === '1') {
        document.getElementById('expired-msg').classList.add('show');
    }
})();

async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('login-btn');
    const errEl    = document.getElementById('error-msg');
    const loadEl   = document.getElementById('loading');

    if (!username || !password) {
        showError('نام کاربری و رمز عبور الزامی است.');
        return;
    }

    const API = getApiBase();
    if (!API) {
        showError('ابتدا آدرس سرور را در بخش «آدرس سرور» تنظیم کنید.');
        document.getElementById('server-box').open = true;
        return;
    }

    btn.disabled = true;
    errEl.classList.remove('show');
    loadEl.classList.add('show');

    try {
        // timeout 10 ثانیه برای جلوگیری از انتظار طولانی
        const controller = new AbortController();
        const timeoutId  = setTimeout(() => controller.abort(), 10000);

        const res = await fetch(`${API}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        const data = await res.json();

        if (data.status === 'success') {
            // ✅ sessionStorage - با بستن مرورگر پاک میشه
            // ✅ اطلاعات کاربر → localStorage (ماندگار، آفلاین)
            localStorage.setItem('pv_user_v2', JSON.stringify({
                id:       data.user.id,
                name:     data.user.name,
                role:     data.user.role,
                username: username,
                loginAt:  Date.now()
            }));
            // ✅ token → env.js (وب: sessionStorage | اپ: localStorage)
            if (data.token) {
                PV_TOKEN_STORE.setItem(PV_TOKEN_KEY, data.token);
            }
            window.location.replace('index.html');
        } else {
            showError(data.message || 'خطا در ورود');
        }
    } catch(err) {
        console.error('[PeechaVisit] Login error:', err);
        const msg = !navigator.onLine
            ? 'اینترنت متصل نیست.'
            : `خطا در اتصال به سرور (${API}). مطمئن شوید سرور روشن است.`;
        showError(msg);
    } finally {
        btn.disabled = false;
        loadEl.classList.remove('show');
    }
}

function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = '⚠️ ' + msg;
    el.classList.add('show');
}
</script>
</body>
</html>
