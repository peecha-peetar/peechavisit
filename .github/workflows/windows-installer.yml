# ساخت نصب‌کنندهٔ ویندوز پیچا ویزیت (برنامهٔ کامپایل‌شده + سرویس ویندوز)
# خروجی: Actions → اجرای مربوطه → Artifacts → PeechaVisit-Setup
name: Windows installer

on:
  push:
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'pwa_client/**'
      - 'fonts/**'
      - '.streamlit/**'
      - 'packaging/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

env:
  WINSW_URL: https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Read version
        id: ver
        shell: python
        run: |
          import os, re
          v = re.search(r'"VERSION":\s*"([^"]+)"', open("config.py", encoding="utf-8").read()).group(1)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"version={v}\n")
          print(v)

      - name: Build program (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/PeechaVisit.spec

      - name: No project source in the build
        shell: pwsh
        run: |
          $names = 'app.py','dashboard.py','admin.py','config.py','db.py','auth.py','peecha_server.py','report.py'
          $found = Get-ChildItem dist\PeechaVisit -Recurse -File | Where-Object { $names -contains $_.Name }
          if ($found) { $found | ForEach-Object { $_.FullName }; throw "project source found in build" }

      # بدون دیتابیس: API، وب‌اپ، داشبورد و پنل مدیریت باید بالا بیایند (صفحهٔ ورود)
      - name: Smoke test
        shell: pwsh
        run: |
          $env:PEECHA_HOME = "$env:RUNNER_TEMP\pvhome"
          $p = Start-Process dist\PeechaVisit\PeechaVisit.exe -ArgumentList '--only','api','pwa','dashboard','admin' -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep 3
            try {
              $api = 0; try { $api = (Invoke-WebRequest http://127.0.0.1:5000/ -UseBasicParsing).StatusCode } catch { }
              $a = (Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing).StatusCode
              $b = (Invoke-WebRequest http://127.0.0.1:8501/_stcore/health -UseBasicParsing).StatusCode
              $c = (Invoke-WebRequest http://127.0.0.1:8502/_stcore/health -UseBasicParsing).StatusCode
              $ok = ($api -eq 200 -and $a -eq 200 -and $b -eq 200 -and $c -eq 200)
              "try $i : api=$api web=$a dashboard=$b admin=$c"
            } catch { }
          }
          Get-ChildItem "$env:PEECHA_HOME\logs" | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          # آیکون کنار ساعت: صفحهٔ وضعیت باید جواب بدهد و سرویس‌ها را «روشن» ببیند
          $t = Start-Process dist\PeechaVisit\PeechaVisitTray.exe -PassThru
          $tray = $null
          for ($i = 0; $i -lt 15 -and -not $tray; $i++) {
            Start-Sleep 2
            try { $tray = Invoke-RestMethod http://127.0.0.1:8599/status.json } catch { }
          }
          "tray status: $($tray.overall) $($tray.up | ConvertTo-Json -Compress)"
          Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "services did not start" }
          if (-not $tray) { throw "tray status page did not answer" }
          "SMOKE OK"

      # WinSW یک بار دانلود و در کش نگه داشته می‌شود (دانلود از گیت‌هاب گاهی 504 می‌دهد)
      - name: Cache WinSW
        id: winsw-cache
        uses: actions/cache@v4
        with:
          path: packaging/winsw
          key: winsw-v2.12.0-x64

      - name: Download WinSW
        if: steps.winsw-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging\winsw | Out-Null
          $urls = @(
            $env:WINSW_URL,
            'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe',
            'https://github.com/winsw/winsw/releases/download/v2.11.0/WinSW-x64.exe',
            'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-net461.exe'
          )
          $ok = $false
          foreach ($u in $urls) {
            for ($i = 1; $i -le 4 -and -not $ok; $i++) {
              try {
                Invoke-WebRequest $u -OutFile packaging\winsw\PeechaVisitService.exe -TimeoutSec 120
                if ((Get-Item packaging\winsw\PeechaVisitService.exe).Length -gt 100000) { $ok = $true; "downloaded: $u" }
              } catch { "download failed ($u, try $i): $($_.Exception.Message)"; Start-Sleep (8 * $i) }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "WinSW could not be downloaded" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # فایل فارسی (Persian.isl) نسخهٔ 6.5 به بعد لازم دارد
          choco upgrade innosetup -y --no-progress | Out-Null
          (Get-Item $iscc).VersionInfo.ProductVersion
          & $iscc /Q "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      - uses: actions/upload-artifact@v5
        with:
          name: PeechaVisit-Setup
          path: dist/PeechaVisit-Setup-*.exe
