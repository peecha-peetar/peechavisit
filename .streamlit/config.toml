# تنظیمات Streamlit برای داشبورد و پنل مدیریت پیچا ویزیت
[client]
toolbarMode = "viewer"     # بدون دکمهٔ Deploy و منوی توسعه‌دهنده

[browser]
gatherUsageStats = false

[server]
headless = true

[theme]
base = "light"
primaryColor = "#3b5bdb"
backgroundColor = "#f3f5fb"
secondaryBackgroundColor = "#eef1f7"
textColor = "#17202e"
